<style>
  :root{
    --forest:#1a2e2a;
    --forest-2:#24413b;
    --moss:#5b7a6b;
    --bg:#f4f6f3;
    --card:#fbfcfa;
    --gold:#b8935a;
    --gold-light:#d9c199;
    --ink:#1f2c28;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  button{font-family:inherit}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.6;
  }
  .app{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
  }
  @media (min-width:641px){
    body{background:#e4e9e3}
    .app{box-shadow:0 0 40px rgba(26,46,42,.12)}
  }

  /* ---------- Header ---------- */
  header{
    background:linear-gradient(135deg,var(--forest) 0%,var(--forest-2) 100%);
    color:#fff;
    padding:52px 24px 30px;
    position:relative;
  }
  .header-label{
    font-size:11px;
    font-weight:700;
    letter-spacing:.32em;
    color:var(--gold-light);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .header-name{
    font-size:34px;
    font-weight:900;
    line-height:1.2;
    letter-spacing:-.01em;
  }
  .header-name .en{display:block;font-size:15px;font-weight:400;color:rgba(255,255,255,.72);margin-top:6px;letter-spacing:.02em}
  .header-tag{
    margin-top:16px;
    font-size:13.5px;
    font-weight:300;
    color:rgba(255,255,255,.82);
    max-width:88%;
  }
  .lang-switch{
    position:absolute;
    top:16px;
    right:16px;
    display:flex;
    border:1px solid rgba(217,193,153,.5);
    border-radius:999px;
    overflow:hidden;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
  }
  .lang-switch button{
    appearance:none;border:0;background:transparent;color:rgba(255,255,255,.65);
    padding:5px 12px;cursor:pointer;font:inherit;
  }
  .lang-switch button.on{background:var(--gold);color:var(--forest)}

  /* ---------- Tabs ---------- */
  .tabbar{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    border-bottom:1px solid rgba(91,122,107,.18);
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
    -ms-overflow-style:none;
    padding:0 8px;
  }
  .tabbar::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;
    appearance:none;border:0;background:transparent;cursor:pointer;
    font:inherit;font-size:13px;font-weight:700;letter-spacing:.14em;
    color:var(--moss);
    padding:15px 16px 13px;
    position:relative;
    white-space:nowrap;
  }
  .tab::after{
    content:"";position:absolute;left:12px;right:12px;bottom:0;
    height:3px;border-radius:3px 3px 0 0;
    background:transparent;
  }
  .tab.on{color:var(--forest)}
  .tab.on::after{background:var(--gold)}

  /* ---------- Content ---------- */
  main{flex:1;padding:20px 16px 28px}
  .panel{display:none}
  .panel.on{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .section-title{
    font-size:11px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;
    color:var(--gold);margin:4px 4px 14px;
  }

  .card{
    background:var(--card);
    border:1px solid rgba(91,122,107,.14);
    border-radius:16px;
    padding:20px;
    margin-bottom:14px;
    box-shadow:0 2px 10px rgba(26,46,42,.05);
  }
  .card .period{
    font-size:12px;font-weight:500;color:var(--gold);
    letter-spacing:.04em;margin-bottom:6px;
  }
  .card h3{
    font-size:16.5px;font-weight:700;color:var(--forest);
    line-height:1.4;margin-bottom:2px;
  }
  .card .subtitle{
    font-size:12.5px;font-weight:500;color:var(--moss);
    margin-bottom:8px;
  }
  .card p{font-size:14px;color:#41534c;font-weight:300;word-break:keep-all}
  .card p + .tags{margin-top:12px}
  .bullets{list-style:none;margin:10px 0 0}
  .bullets li{
    position:relative;padding-left:14px;
    font-size:13.5px;color:#41534c;font-weight:300;
    margin-top:6px;word-break:keep-all;
  }
  .bullets li::before{
    content:"";position:absolute;left:0;top:.62em;
    width:5px;height:5px;border-radius:50%;
    background:var(--gold);
  }
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .tag{
    font-size:11px;font-weight:500;letter-spacing:.03em;
    color:var(--moss);
    background:rgba(91,122,107,.1);
    border:1px solid rgba(91,122,107,.2);
    padding:3px 10px;border-radius:999px;
  }
  .tag.gold{color:var(--gold);background:rgba(184,147,90,.09);border-color:rgba(184,147,90,.3)}

  .about-lead{
    font-size:14.5px;font-weight:300;color:#41534c;
    word-break:keep-all;
  }

  .footnote{
    font-size:12px;color:var(--moss);font-weight:300;
    padding:0 6px;margin-top:2px;
  }

  /* ---------- Contact ---------- */
  .contact-mail{
    font-size:17px;font-weight:700;color:var(--forest);
    word-break:break-all;margin:2px 0 16px;
  }
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:130px;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    font-size:13.5px;font-weight:700;letter-spacing:.02em;
    padding:13px 18px;border-radius:12px;cursor:pointer;
    text-decoration:none;text-align:center;
    border:1px solid transparent;
    transition:opacity .15s ease;
  }
  .btn:active{opacity:.85}
  .btn-primary{background:var(--forest);color:#fff}
  .btn-ghost{background:transparent;color:var(--forest);border-color:rgba(26,46,42,.3)}
  .copied-msg{
    margin-top:10px;font-size:12.5px;color:var(--gold);
    min-height:19px;font-weight:500;
  }

  /* ---------- Footer ---------- */
  footer{
    padding:18px 0 26px;text-align:center;
    font-size:11px;letter-spacing:.12em;color:var(--moss);
  }
  footer .gold{color:var(--gold);font-weight:700}
</style>

          tags:['Devin','Vibe Coding'] },
      ]},
      EDU: { title: '학력', items: [
        { period:'— 1993', title:'고려대학교 사학과 졸업', titleEn:'Korea University, B.A. in History',
          bullets:[], tags:['Korea University','History'] },
      ]},
      BUILD: { title: '이 사이트에 대하여', html: `
        <div class="card">
          <div class="period">일회용 여행 앱</div>
          <h3>일본 여행에서 Claude로 만든 앱</h3>
          <ul class="bullets">
            <li>최근 일본 여행에서 Claude로 저만을 위한 1회용 여행 앱을 만들어 사용했습니다.</li>
            <li>항공편·렌터카·숙소 정보를 한곳에 모으고, 일자별 일정을 탭으로 보여주고, 이동 구간마다 지도 링크를 걸어둬서 가방을 뒤지거나 주소를 입력할 필요가 없었습니다.</li>
            <li>코딩이 개발자만의 전유물이 아닌 세상이 온 것을 즐기는 중입니다.</li>
          </ul>
          <div class="tags">
            <span class="tag gold">Claude</span>
            <span class="tag">Vibe Coding</span>
          </div>
        </div>
        <div class="card">
          <div class="period">THIS SITE</div>
          <p class="about-lead">이 이력서 사이트는 Devin으로 만들었습니다.</p>
          <div class="tags">
            <span class="tag gold">Devin</span>
            <span class="tag">AI Software Engineer</span>
            <span class="tag">GitHub Pages</span>
          </div>
        </div>`},
      CONTACT: { title: '연락처', html: `
        <div class="card">
          <div class="period">EMAIL</div>
          <div class="contact-mail">jae@eineblu.me</div>
          <div class="btn-row">
            <a class="btn btn-primary" href="mailto:jae@eineblu.me" id="btn-mail"></a>
            <button class="btn btn-ghost" type="button" id="btn-copy"></button>
          </div>
          <div class="copied-msg" id="copied"></div>
        </div>`},
    },
    mail: '이메일 보내기',
    copy: '주소 복사',
    copied: '이메일 주소가 복사되었습니다.',
  },
};

const ORDER = ['ABOUT','CAREER','NOW','EDU','BUILD','CONTACT'];
let lang = 'en';
let active = 'ABOUT';

const tabbar = document.getElementById('tabbar');
const main = document.getElementById('main');

function cardHtml(item){
  const title = lang==='kr' ? item.title : item.titleEn;
  const sub = lang==='kr' ? item.titleEn : item.title;
  const bullets = (item.bullets||[]).map(b=>`<li>${b}</li>`).join('');
  const tags = (item.tags||[]).map((t,i)=>`<span class="tag${i===0?' gold':''}">${t}</span>`).join('');
  return `<div class="card">
    <div class="period">${item.period}</div>
    <h3>${title}</h3>
    ${sub?`<div class="subtitle">${sub}</div>`:''}
    ${bullets?`<ul class="bullets">${bullets}</ul>`:''}
    ${tags?`<div class="tags">${tags}</div>`:''}
  </div>`;
}

function renderTabs(){
  const t = T[lang];
  tabbar.innerHTML = t.tabs.map(name=>
    `<button type="button" class="tab${name===active?' on':''}" data-tab="${name}">${name}</button>`
  ).join('');
}

function renderMain(){
  const t = T[lang];
  main.innerHTML = ORDER.map(name=>{
    const s = t.sections[name];
    let body;
    if(s.html !== undefined){
      body = s.html;
    }else{
      body = s.items.map(cardHtml).join('');
      if(s.footnote) body += `<div class="footnote">${s.footnote}</div>`;
    }
    return `<section class="panel${name===active?' on':''}" id="panel-${name}">
      <div class="section-title">${s.title}</div>${body}</section>`;
  }).join('');

  document.getElementById('btn-mail').textContent = t.mail;
  document.getElementById('btn-copy').textContent = t.copy;
  document.getElementById('btn-copy').addEventListener('click', async ()=>{
    const msg = document.getElementById('copied');
    try{
      await navigator.clipboard.writeText('jae@eineblu.me');
      msg.textContent = t.copied;
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = 'jae@eineblu.me';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      msg.textContent = t.copied;
    }
    setTimeout(()=>{ msg.textContent=''; }, 2500);
  });
}

function renderHeader(){
  const t = T[lang];
  document.getElementById('hdr-label').textContent = t.label;
  document.getElementById('hdr-name').textContent = t.name;
  document.getElementById('hdr-name-alt').textContent = t.nameAlt;
  document.getElementById('hdr-tag').textContent = t.tagline;
  document.getElementById('btn-kr').classList.toggle('on', lang==='kr');
  document.getElementById('btn-en').classList.toggle('on', lang==='en');
  document.documentElement.lang = lang;
}

function render(){
  renderHeader(); renderTabs(); renderMain();
}

function activate(name, push=true){
  active = name;
  document.querySelectorAll('.tab').forEach(b=>{
    const on = b.dataset.tab===name;
    b.classList.toggle('on', on);
    if(on) b.scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='panel-'+name));
  if(push) history.replaceState(null,'','#'+name.toLowerCase());
}

tabbar.addEventListener('click', e=>{
  const b = e.target.closest('.tab');
  if(b) activate(b.dataset.tab);
});
document.getElementById('btn-kr').addEventListener('click', ()=>{ if(lang!=='kr'){lang='kr';render();} });
document.getElementById('btn-en').addEventListener('click', ()=>{ if(lang!=='en'){lang='en';render();} });

const h = location.hash.replace('#','').toUpperCase();
if(ORDER.includes(h)) active = h;
render();
</script>
</body>
</html>
