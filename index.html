<style>

    --ink:#0f0f0e;
    --paper:#f5f4ef;
    --white:#ffffff;
    --line:#d8d6cd;
    --muted:#6a6963;
    --accent:#e5421e;

  *{margin:0;padding:0;box-sizing:border-box}
  button{font-family:inherit}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;

  .app{

    background:var(--paper);
    display:flex;flex-direction:column;
  }
  @media (min-width:641px){

    background:var(--white);
  }
  .topline{

    margin-bottom:26px;
  }
  .header-label{
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.22em;

  }
  .header-label::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:9px}
  .lang-switch{
    display:flex;border:1.5px solid var(--ink);
    font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.08em;
  }
  .lang-switch button{
    appearance:none;border:0;background:transparent;color:var(--ink);
    padding:6px 12px;cursor:pointer;font:inherit;
  }
  .lang-switch button.on{background:var(--ink);color:var(--white)}
  .hero{display:flex;align-items:flex-end;gap:18px}
  .avatar{
    position:relative;flex:0 0 auto;
    width:96px;height:120px;border-radius:2px;
    background:var(--ink);overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .avatar::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:5px;background:var(--accent)}
  .avatar .ini{font-weight:900;font-size:30px;color:var(--white);letter-spacing:.02em}
  .avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
  .hero-text{min-width:0;padding-bottom:4px}
  .header-name{font-weight:900;font-size:46px;line-height:1.08;letter-spacing:-.03em}
  .header-name .en{
    display:block;font-family:var(--mono);font-size:12.5px;font-weight:400;
    color:var(--muted);margin-top:10px;letter-spacing:.04em;
  }
  .header-tag{
    margin-top:26px;
    font-size:15px;font-weight:400;line-height:1.75;
    color:#2a2a28;word-break:keep-all;
  }
  .header-tag .kw{
    display:inline-block;background:var(--accent);color:var(--white);
    font-weight:700;padding:0 8px 1px;margin:0 2px;border-radius:2px;
  }

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:100%;max-width:640px;z-index:20;
    display:flex;justify-content:space-between;
    background:var(--ink);
    padding:0 6px max(0px,env(safe-area-inset-bottom));
  }
  .tab{
    flex:1 1 0;min-width:0;
    appearance:none;border:0;background:transparent;cursor:pointer;
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.06em;
    color:rgba(255,255,255,.55);
    padding:17px 2px 15px;position:relative;white-space:nowrap;
    transition:color .2s ease;
  }
  .tab::before{
    content:"";position:absolute;left:18%;right:18%;top:0;height:3px;
    background:var(--accent);transform:scaleX(0);transition:transform .2s ease;
  }
  .tab.on{color:var(--white)}
  .tab.on::before{transform:scaleX(1)}

  /* ---------- Content ---------- */
  main{flex:1;padding:34px 22px 110px}
  .panel{display:none}
  .panel.on{display:block;animation:rise .3s ease}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.panel.on{animation:none}.tab::before{transition:none}}

  .section-title{
    display:flex;align-items:baseline;gap:12px;
    font-weight:900;font-size:30px;letter-spacing:-.03em;line-height:1.1;
    margin-bottom:22px;

    border-top:2px solid var(--ink);margin-bottom:34px;
  }
  .stat{padding:18px 4px 18px 0;border-bottom:1px solid var(--line)}

  .stat:nth-child(even){padding-left:18px}

  /* entries (replace cards) */

  .card:first-child{border-top:0;padding-top:0}
  .card .period{

  .card .subtitle{font-family:var(--mono);font-size:12px;font-weight:400;color:var(--muted);margin-top:3px;margin-bottom:6px;letter-spacing:.02em}
  .card p{font-size:14.5px;color:#2e2e2b;font-weight:400;word-break:keep-all}
  .bullets{list-style:none;margin:12px 0 0}

  .press-link{color:var(--ink);text-decoration:none;border-bottom:1.5px solid var(--accent);font-weight:500}
  .press-link .arrow{color:var(--accent);font-size:12px;margin-left:3px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
  .tag{
    font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.04em;
    color:var(--ink);border:1px solid var(--ink);padding:3px 9px;border-radius:2px;

  .card .about-lead + .bullets{margin-top:10px}
  .footnote{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px;line-height:1.6}

  .timeline .card{position:relative;border-top:0;padding:0 0 30px}
  .timeline .card:last-child{padding-bottom:6px}
  .timeline .card::before{
    content:"";position:absolute;left:-33px;top:2px;width:14px;height:14px;

  /* ---------- Contact ---------- */
  .contact-mail{font-weight:900;font-size:24px;letter-spacing:-.02em;word-break:break-all;margin:2px 0 20px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{

    padding:15px 18px;border-radius:2px;cursor:pointer;text-decoration:none;text-align:center;
    border:1.5px solid var(--ink);transition:transform .1s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--ink);color:var(--white)}
  .btn-ghost{background:transparent;color:var(--ink)}
  .copied-msg{margin-top:10px;font-size:12.5px;color:var(--accent);min-height:19px;font-weight:500}

  /* ---------- Footer ---------- */
  footer{
    padding:6px 22px 26px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--muted);
  }
  footer .gold{color:var(--ink);font-weight:500;border-bottom:1.5px solid var(--accent)}
</style>
</head>

const ORDER = ['ABOUT','CAREER','NOW','EDU','BUILD','CONTACT'];
let lang = 'en';
let active = 'ABOUT';

const tabbar = document.getElementById('tabbar');
const main = document.getElementById('main');

function cardHtml(item){
  const title = lang==='kr' ? item.title : item.titleEn;
  const sub = lang==='kr' ? item.titleEn : item.title;
  const bullets = (item.bullets||[]).map(b=>`<li>${b}</li>`).join('');
  const tags = (item.tags||[]).map((t,i)=>`<span class="tag${i===0?' gold':''}">${t}</span>`).join('');
  return `<div class="card">
    <div class="period">${item.period}</div>
    <h3>${title}</h3>
    ${sub?`<div class="subtitle">${sub}</div>`:''}
    ${bullets?`<ul class="bullets">${bullets}</ul>`:''}
    ${tags?`<div class="tags">${tags}</div>`:''}
  </div>`;
}

function renderTabs(){
  const t = T[lang];
  tabbar.innerHTML = t.tabs.map(name=>
    `<button type="button" class="tab${name===active?' on':''}" data-tab="${name}">${name}</button>`
  ).join('');
}

function renderMain(){
  const t = T[lang];
  main.innerHTML = ORDER.map(name=>{
    const s = t.sections[name];
    let body;
    if(s.html !== undefined){
      body = s.html;
    }else{
      body = s.items.map(cardHtml).join('');
      if(s.footnote) body += `<div class="footnote">${s.footnote}</div>`;
    }
    if(name==='ABOUT'){
      body = `<div class="stats">${t.stats.map(x=>`<div class="stat"><div class="num">${x[0]}</div><div class="lbl">${x[1]}</div></div>`).join('')}</div>` + body;
    }
    if(name==='CAREER'){
      body = body.replace(/<div class="footnote">[\s\S]*$/, '');
      body = `<div class="timeline">${body}</div>` + (s.footnote ? `<div class="footnote">${s.footnote}</div>` : '');
    }
    return `<section class="panel${name===active?' on':''}" id="panel-${name}">
      <div class="section-title"><span class="n">${String(ORDER.indexOf(name)+1).padStart(2,'0')}</span>${s.title}</div>${body}</section>`;
  }).join('');

  document.getElementById('btn-mail').textContent = t.mail;
  document.getElementById('btn-copy').textContent = t.copy;
  document.getElementById('btn-copy').addEventListener('click', async ()=>{
    const msg = document.getElementById('copied');
    try{
      await navigator.clipboard.writeText('jae@eineblu.me');
      msg.textContent = t.copied;
    }catch(e){
      const ta = document.createElement('textarea');
      ta.value = 'jae@eineblu.me';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); ta.remove();
      msg.textContent = t.copied;
    }
    setTimeout(()=>{ msg.textContent=''; }, 2500);
  });
}

function renderHeader(){
  const t = T[lang];
  document.getElementById('hdr-label').textContent = t.label;
  document.getElementById('hdr-name').textContent = t.name;
  document.getElementById('hdr-name-alt').textContent = t.nameAlt;
  document.getElementById('hdr-tag').innerHTML = t.tagline;
  document.getElementById('btn-kr').classList.toggle('on', lang==='kr');
  document.getElementById('btn-en').classList.toggle('on', lang==='en');
  document.documentElement.lang = lang;
}

function render(){
  renderHeader(); renderTabs(); renderMain();
}

function activate(name, push=true){
  active = name;
  document.querySelectorAll('.tab').forEach(b=>{
    const on = b.dataset.tab===name;
    b.classList.toggle('on', on);
  });
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on', p.id==='panel-'+name));
  if(push) history.replaceState(null,'','#'+name.toLowerCase());
  window.scrollTo({top:0,behavior:'auto'});
}

tabbar.addEventListener('click', e=>{
  const b = e.target.closest('.tab');
  if(b) activate(b.dataset.tab);
});
document.getElementById('btn-kr').addEventListener('click', ()=>{ if(lang!=='kr'){lang='kr';render();} });
document.getElementById('btn-en').addEventListener('click', ()=>{ if(lang!=='en'){lang='en';render();} });

const h = location.hash.replace('#','').toUpperCase();
if(ORDER.includes(h)) active = h;
render();
</script>
